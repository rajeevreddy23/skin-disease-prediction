services:
  - type: web
    name: dermascan-ai
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "streamlit run app/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --server.enableCORS false --server.enableXsrfProtection false"
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
